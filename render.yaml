## PixelFlow – Render Blueprint
##
## Usage:
##   1. Push this repo to GitHub.
##   2. In Render Dashboard → New → Blueprint → connect your repo.
##   3. Render will create the database and web service automatically.
##   4. After the first deploy succeeds, set the MANUAL env vars listed
##      below (marked "# SET THIS") in the Render dashboard:
##      Dashboard → pixelflow-backend → Environment → Edit.
##   5. Deploy your frontend to Vercel, then update ALLOWED_ORIGINS with
##      your production Vercel URL and redeploy the backend.

services:
  - type: web
    name: pixelflow-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --workers 1 ensures the in-memory rate-limiter works correctly.
    # Upgrade to a paid plan + Redis-backed limiter before adding workers.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health

    envVars:
      # ── Runtime ──────────────────────────────────────────────────────────────
      # Render ignores runtime.txt. Without this, a new/synced service builds on
      # Render's default Python (3.13), which has no wheels for the pinned
      # numpy/scikit-image/PyWavelets/psycopg2 versions, so the build fails.
      # (The live service already sets PYTHON_VERSION=3.11.9 by hand.)
      - key: PYTHON_VERSION
        value: 3.11.9

      # ── Application ──────────────────────────────────────────────────────────
      - key: APP_NAME
        value: PixelFlow
      - key: VERSION
        value: 1.3.0
      - key: DEBUG
        value: false

      # ── Server ───────────────────────────────────────────────────────────────
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        fromService:
          type: web
          name: pixelflow-backend
          property: port

      # ── Storage ──────────────────────────────────────────────────────────────
      - key: USE_SQLITE
        value: false

      # ── Database ─────────────────────────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: pixelflow-db
          property: connectionString

      # ── Rate limiting behind proxies ─────────────────────────────────────────
      # Without this, all visitors share one rate-limit bucket (they all reach
      # the app from Render's proxy IP). Uncomment ONE:
      #   1 = browser calls Render directly (REACT_APP_API_URL=https://…onrender.com/api)
      #   2 = browser calls Vercel, which proxies /api to Render (REACT_APP_API_URL=/api)
      # - key: TRUSTED_PROXY_HOPS
      #   value: 2

      # ── Security ─────────────────────────────────────────────────────────────
      # Render generates a unique, stable value on first deploy.
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7

      # ── CORS ─────────────────────────────────────────────────────────────────
      # SET THIS – comma-separated list of allowed origins.
      # Add your Vercel URL after deploying the frontend, e.g.:
      #   https://pixelflow.vercel.app,http://localhost:3000
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000  # replace after frontend deploy

      # Automatically allows all Vercel preview-deployment URLs for this project.
      # Update the prefix (pixelflow) to match your actual Vercel project name.
      - key: ALLOWED_ORIGINS_REGEX
        value: https://pixelflow(-[a-z0-9]+)*\.vercel\.app

      # ── Google OAuth (optional) ───────────────────────────────────────────────
      # Leave blank to disable Google Sign-In.
      # SET THIS – paste values from Google Cloud Console → Credentials.
      - key: GOOGLE_CLIENT_ID
        value: ""  # e.g. 123456789-abc.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        value: ""  # e.g. GOCSPX-...
      # SET THIS – must match the URI registered in Google Cloud Console.
      - key: GOOGLE_REDIRECT_URI
        value: ""  # e.g. https://pixelflow.vercel.app/auth/google/callback

databases:
  - name: pixelflow-db
    databaseName: pixelflow
    user: pixelflow_user
    plan: free
    region: oregon          # keep same region as the web service to minimise latency
    postgresMajorVersion: 16
    # NOTE: Render's free Postgres expires 30 days after creation and is then
    # deleted. When that happens the web service crash-loops on startup with
    # 'could not translate host name "dpg-...-a"'. Create a new database (or
    # use a paid plan) and point DATABASE_URL at it.
