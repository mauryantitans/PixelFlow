name: CI

on:
  push:
    branches: [React_FastAPI, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app/processing tests

      - name: Ruff format check
        run: ruff format --check app/processing tests

      - name: mypy
        run: mypy

      - name: pytest
        env:
          DEBUG: "True"
          USE_SQLITE: "True"
          SECRET_KEY: "ci-secret-key"
        run: pytest

  frontend:
    name: Frontend (types · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test -- --watchAll=false
        env:
          CI: "true"

      # Same command Vercel runs: ESLint warnings fail the build.
      - name: Production build
        run: npm run build
        env:
          CI: "true"

  e2e:
    name: Browser checks (workflows · accessibility)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    env:
      TOOLS: /tmp/e2e-tools
      CHROME_PATH: /usr/bin/google-chrome
      FX: /tmp/fixtures
      USER_EMAIL: ci-user@example.com
      USER_PASSWORD: CiUser-Pass-2026!
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: CiAdmin-Pass-2026!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install app and browser tooling
        run: |
          pip install -r backend/requirements.txt
          (cd frontend && npm ci)
          npm install --no-save --prefix "$TOOLS" puppeteer-core@23.11.1 @axe-core/puppeteer@4.14.0 axe-core@4.14.0 lighthouse@12.8.2

      - name: Build the frontend
        run: (cd frontend && npm run build)
        env:
          CI: "true"
          REACT_APP_API_URL: http://localhost:8000/api

      - name: Start the stack and create test accounts
        run: |
          python3 scripts/e2e/make_fixtures.py "$FX"
          (cd backend && USE_SQLITE=True DEBUG=True SECRET_KEY=ci-secret-key JOB_POLL_SECONDS=0.5 \
            nohup uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &)
          nohup node scripts/e2e/serve-build.js "$PWD/frontend/build" 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
          register() { curl -sf -X POST http://localhost:8000/api/auth/register -H 'Content-Type: application/json' \
            -d "{\"email\":\"$1\",\"username\":\"$2\",\"password\":\"$3\",\"full_name\":\"$2\"}" > /dev/null; }
          register "$USER_EMAIL" ciuser "$USER_PASSWORD"
          register e2e-a@example.com e2ea CiA-Pass-2026!
          register e2e-b@example.com e2eb CiB-Pass-2026!

      - name: Workflows (uploads, live preview, batch, picking, reload)
        run: IMG=$FX/test1.png BIG1=$FX/big1.png BIG2=$FX/big2.png TIFF=$FX/test3.tif BAD=$FX/bad.gif node scripts/e2e/workflows.js

      - name: Sessions and sign-in
        run: IMG1=$FX/test1.png IMG2=$FX/test2.png A_EMAIL=e2e-a@example.com A_PASSWORD=CiA-Pass-2026! B_EMAIL=e2e-b@example.com B_PASSWORD=CiB-Pass-2026! node scripts/e2e/session-flow.js

      - name: Custom filters
        run: IMG=$FX/test1.png node scripts/e2e/custom-filters.js

      - name: Product features (samples, drag-and-drop, share links, theme sync)
        run: IMG=$FX/test1.png node scripts/e2e/product.js

      - name: Background batch jobs
        run: BIG1=$FX/big1.png BIG2=$FX/big2.png node scripts/e2e/batch-jobs.js

      - name: Appearance picker
        run: node scripts/e2e/appearance.js

      - name: Accessibility audit (Lighthouse + axe, light and dark)
        run: |
          # The admin account is created on startup from ADMIN_EMAIL/ADMIN_PASSWORD (above).
          IMG1=$FX/test1.png PHASE=ci node a11y-reports/scripts/audit.js
          python3 a11y-reports/scripts/check-summary.py a11y-reports/ci/summary.json

      - name: Logs on failure
        if: failure()
        run: tail -n 200 /tmp/backend.log /tmp/web.log
