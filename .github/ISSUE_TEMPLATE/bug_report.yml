name: Bug report
description: Something in PixelFlow doesn't work as expected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check [CURRENT_LIMITATIONS.md](https://github.com/Mauryantitans/PixelFlow/blob/React_FastAPI/CURRENT_LIMITATIONS.md) and the open issues first.
        **Security problems:** don't file them here. Use the repository's Security tab → *Report a vulnerability* (see [SECURITY.md](https://github.com/Mauryantitans/PixelFlow/blob/React_FastAPI/SECURITY.md)).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The pipeline (operations and their settings) and the kind of image help a lot.
      placeholder: |
        1. Upload a 4000×3000 PNG
        2. Add Gaussian Blur (radius 5), then Canny Edge Detection
        3. Turn on Live Processing
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include any error banner text, and errors from the browser console or backend log.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Live demo (Vercel + Render)
        - Local (start.sh / start.bat)
        - Local (Docker Compose)
        - Self-hosted elsewhere
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Live Processing
        - Batch (Apply Pipeline)
        - Not processing related
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 133, Chrome 131, Safari 18
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and device
      placeholder: Windows 11 desktop, macOS 15, iOS 18 iPhone, Android 15
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      description: The Appearance menu (palette icon) in the header.
      options:
        - Classic
        - Spectrum
        - Verdant
        - Cobalt
        - Fjord
        - Orchid
        - Safelight
        - Don't know
  - type: dropdown
    id: colour_mode
    attributes:
      label: Light or dark mode
      options:
        - Light
        - Dark
        - Don't know
  - type: dropdown
    id: account
    attributes:
      label: Signed in?
      options:
        - Signed in
        - Guest (signed out)
        - Admin
  - type: input
    id: version
    attributes:
      label: PixelFlow version or commit
      description: Shown at the backend's `/` and `/health` endpoints; or the commit you run locally.
      placeholder: 1.4.0
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag files here. Please don't include images or data you aren't allowed to share.
  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibility
      options:
        - label: This affects keyboard, screen-reader, zoom or contrast use
